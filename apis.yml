aid: 1x-robotics
name: 1X Technologies
description: >-
  1X Technologies (formerly Halodi Robotics) is a Norwegian-American humanoid
  robotics company building general-purpose bipedal robots designed to live
  and work alongside people. Founded in 2014 in Norway by Bernt Øyvind
  Børnich, the company is now headquartered in Palo Alto, California with
  R&D and manufacturing presence in Moss, Norway and a new vertically
  integrated NEO factory in Hayward, California. 1X is backed by the OpenAI
  Startup Fund, EQT Ventures, Tiger Global, Samsung NEXT, and others
  through Series A2 ($23.5M, 2023), Series B ($100M, 2024), and a $1B
  raise reported in 2025. Its commercial robots are EVE — a wheeled
  upper-humanoid deployed in industrial and security settings since 2022 —
  and NEO, a bipedal home humanoid that began pre-orders October 28, 2025
  at $20,000 (or $499/month) with consumer deliveries in 2026. 1X also
  acquired Kind Humanoid (Jan 2025) and announced a partnership to deploy
  up to 10,000 NEO robots into EQT portfolio company factories and
  warehouses between 2026 and 2030. Unlike most humanoid robotics
  vendors, 1X publishes meaningful open-source artifacts: the EVE ROS2
  API (custom WholeBodyTrajectory and DrivingCommand message types) and
  the halodi-messages package on GitHub under Apache-2.0, plus the
  1X World Model Challenge with 100+ hours of vector-quantized EVE
  observations and GENIE baseline models released on Hugging Face. There
  is no public REST/HTTP developer API or hosted developer portal — the
  developer surface is ROS2 messages, robot models in URDF, and the
  world-model dataset/model artifacts.
